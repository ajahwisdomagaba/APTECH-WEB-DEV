<!DOCTYPE html>
<html lang="en">

<body>
  <h2>Asynccode</h2>
  <script> 
async function getData() {
  let resp = await fetch('https://jsonplaceholder.typicode.com/todos/1')
  let data = await resp.json() // Actual data

  console.log(data);
  //return is resolve value of a promise

  return data
}

let data = getData().then((data) => console.log(data))
  </script>
</body>
</html>
